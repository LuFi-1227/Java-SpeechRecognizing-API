spring.ai.openai.api-key=Key
spring.ai.openai.base-url=https://api.groq.com/openai/
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.4

spring.ai.openai.audio.transcription.options.model=whisper-large-v3
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0.4
spring.ai.openai.audio.transcription.options.prompt=Transcreva o áudio em português brasileiro. As frases geralmente contem 1 ação, 1 valor em reais e 1 local. O valor em reais deve ser escrito por extenso, e o local deve ser escrito com a primeira letra maiúscula. Exemplo: "Paguei cinquenta reais no supermercado". Se não houver valor em reais, apenas transcreva o áudio. Se não houver local, apenas transcreva o áudio.
spring.ai.model.audio.transcription=openai

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=canopylabs/orpheus-v1-english
spring.ai.openai.audio.speech.options.voice=hannah
spring.ai.openai.audio.speech.options.response-format=wav

spring.main.web-application-type=servlet
